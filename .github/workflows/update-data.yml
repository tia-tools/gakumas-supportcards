# Guards: the published numbers, during an update nobody watches. Every day it regenerates the
# card data from vertesan/gakumasu-diff and publishes it WITHOUT a person reading the diff, which
# is safe only because every gate below runs first, in this job, before anything is merged:
#   - the generator stops on a broken upstream dump, and hides (never zeroes) a card it cannot
#     score, listing it in data/held.generated.ts (docs/adr/0005);
#   - the unit tests, the type check and the lint pass;
#   - scripts/check-score-stability.ts finds no card whose score moved although its own data did
#     not (docs/adr/0006).
# A failure publishes nothing: the site keeps its last good data, GitHub mails the failure, and
# the last job, notify, posts to the owner's Discord through Nudge (github.com/Taka499/nudge; an
# OIDC token, no stored secret) whenever the update or the deploy failed or was cancelled, data was
# published or the run was started by hand, and on Monday mornings even when nothing changed, so a
# schedule that stopped running is noticed (D43, D46). Its title also names a failed image step,
# which by design does not fail the job and so would otherwise read as a success. It is a job of
# its own, after deploy, so a failed deploy is reported too, and so it is the only job that can
# mint an OIDC token.
# The gates run here rather than as pull-request checks because a pull request opened with the
# built-in token triggers no workflows. Held cards open (or update) one issue labelled
# `held-cards`; they do not block the other cards. Images for new cards are fetched and uploaded
# on a best-effort basis and can never block the data (first plan, decisions D34, D40, D41).
name: Update data

on:
  schedule:
    # Daily 11:30 and 20:30 JST. Upstream commits at :03 past the hour it sees a change: 11:03 JST
    # for most updates (36 of 62 since 2026-03), and when later, mostly between 15:03 and 20:03
    # (20:03 the most common), so the evening run publishes those the same day; only a 21:03
    # update (1 of 62) waits for the next morning. Half past leaves room for upstream's push and
    # the raw-file cache, and off the hour is where scheduled runs are delayed least (first plan,
    # decision D46). The time zone is stated rather than left to the UTC default: with "30 2" in
    # UTC the runs of 2026-09-28 and 09-29 started at 17:48–17:50 JST.
    - cron: "30 11 * * *"
      timezone: "Asia/Tokyo"
    - cron: "30 20 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

# Nothing by default; each job states what it needs.
permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      images: ${{ steps.images.outcome }}
      title: ${{ steps.report.outputs.title }}
      held: ${{ steps.report.outputs.held }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile

      # No .cache/ exists on a runner, so the generator fetches today's tables.
      - name: Regenerate the data from upstream
        run: bun run generate

      - name: Did anything change?
        id: detect
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes upstream; nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data
          fi

      - name: "Gate: unit tests"
        if: steps.detect.outputs.changed == 'true'
        run: bun test
      - name: "Gate: type check"
        if: steps.detect.outputs.changed == 'true'
        run: bun run type-check
      - name: "Gate: lint"
        if: steps.detect.outputs.changed == 'true'
        run: bun run lint
      - name: "Gate: no score moved without its card's data moving"
        if: steps.detect.outputs.changed == 'true'
        run: bun scripts/check-score-stability.ts --base HEAD

      # Best effort from here to the end of the image steps: a game server that refuses the
      # runner, or a decoder that needs a new engine version, leaves a card showing its name
      # instead of its art, and must not stop the data (D41). Its outcome (failure, while the job's
      # conclusion stays success) goes out as the job output `images` for notify to report.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
      - name: Images for cards the site does not show yet
        id: images
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        working-directory: scripts/images
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./fetch-vendor.sh
          uv sync --frozen
          uv run extract.py --only-missing
          uv run upload.py

      - name: Describe the update
        id: report
        if: steps.detect.outputs.changed == 'true'
        run: bun scripts/update-report.ts --base HEAD --pr-body "$RUNNER_TEMP/pr.md" --issue-body "$RUNNER_TEMP/issue.md"

      - name: Open the pull request and merge it
        if: steps.detect.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.report.outputs.title }}
        run: |
          branch="data/update-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "$TITLE"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
          # Mergeability is computed a moment after creation; a repository rule that demands a
          # review makes this fail for good, which leaves the pull request open for a person.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --merge --delete-branch --subject "Merge branch '$branch' — ${TITLE#chore: }"; then exit 0; fi
            sleep 10
          done
          echo "::error::The pull request could not be merged; it stays open for a person."
          exit 1

      - name: Ask a person about held cards, or close the question
        if: steps.detect.outputs.changed == 'true'
        env:
          HELD: ${{ steps.report.outputs.held }}
        run: |
          gh label create held-cards --color D93F0B --description "Cards hidden until a person decides how to count them" --force
          open=$(gh issue list --label held-cards --state open --json number --jq '.[0].number // empty')
          if [ "$HELD" -gt 0 ]; then
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file "$RUNNER_TEMP/issue.md"
              gh issue comment "$open" --body "Still held after the update of $(date -u +%Y-%m-%d); the list above is current. Run: $RUN_URL"
            else
              gh issue create --label held-cards --title "Held cards need a decision ($HELD)" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Nothing is held after the update of $(date -u +%Y-%m-%d). Run: $RUN_URL"
          fi

      # develop must not fall behind production's data. A conflict is not forced: it becomes a pull request.
      - name: Merge main back into develop
        if: steps.detect.outputs.changed == 'true'
        run: |
          git fetch origin main
          if ! git fetch origin develop; then
            echo "No develop branch on the remote; nothing to merge back into."
            exit 0
          fi
          git switch -C develop origin/develop
          if git merge --no-ff origin/main -m "Merge branch 'main' into develop — data update $(date -u +%Y-%m-%d)"; then
            git push origin develop
          else
            git merge --abort
            gh pr create --base develop --head main --title "Merge main into develop — data update conflicts" --body "The data update merged into main, but main does not merge cleanly into develop. Resolve by hand. Run: $RUN_URL"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Runs after everything, whatever happened: a failed gate or deploy is the message that matters
  # most. A scheduled run that found nothing stays quiet except the Monday 11:30 one, the weekly
  # sign that the schedule still runs, said once a week rather than by both Monday runs (D46).
  # deploy is "skipped" when nothing changed, which is not a failure.
  notify:
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # 1 is Monday, in Japan, where the schedule is set.
      - name: Which weekday is it?
        id: when
        run: echo "weekday=$(TZ=Asia/Tokyo date +%u)" >> "$GITHUB_OUTPUT"
      - name: Tell Discord how it went
        if: needs.update.result != 'success' || (needs.deploy.result != 'success' && needs.deploy.result != 'skipped') || needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || (github.event.schedule == '30 11 * * *' && steps.when.outputs.weekday == '1')
        uses: Taka499/nudge/actions/notify@d9f7f1ac185050506d526532a0e24861564422cf # v1.1.0
        with:
          endpoint: https://nudge.tia.run
          title: "Data update: update ${{ needs.update.result }}, deploy ${{ needs.deploy.result }}${{ needs.update.outputs.images == 'failure' && ', images failure' || '' }}"
          body: |
            ${{ needs.update.outputs.title || (needs.update.result == 'success' && 'No changes upstream; nothing published.' || 'Nothing was published.') }}
            Held cards: ${{ needs.update.outputs.held || '0' }}
