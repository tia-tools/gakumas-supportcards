# Guards: production. This is the only path by which https://gakumas-supportcards.tia.run changes.
# It builds the page from `main` and deploys the Worker, and refuses to when the unit tests, the
# type check or the score snapshot check fail — the last one catches a route profile or engine
# change whose regenerated data/scores.generated.json was not committed (docs/adr/0006).
# `main` is production and `develop` is development (first plan, decision D40): merging into
# main IS the deploy. Called by update-data.yml after an unattended data update, because a merge
# made with the built-in token does not trigger `push` workflows.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "infra/worker/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One production deployment at a time, in order; a newer run waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun scripts/check-score-stability.ts
      - run: bun run build
      - name: Deploy the Worker and the static page
        working-directory: infra/worker
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
