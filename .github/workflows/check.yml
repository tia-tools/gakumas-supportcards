# Guards: develop. Runs on every pull request into develop — Dependabot's action updates above all —
# the same checks deploy.yml runs before production (unit tests, type check, lint, score snapshot, build),
# so a pull request is known to pass before a person merges it rather than at the next release
# (first plan, decision D47). Read-only: it gets no secrets and cannot write to the repository,
# which is what makes it safe to run on a pull request whose code is not yet trusted.
name: Check

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

# A new push to the same pull request replaces the run for the old one.
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun run lint
      - run: bun scripts/check-score-stability.ts
      - run: bun run build
