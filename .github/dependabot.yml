# Keeps the actions in .github/workflows current. Every action is pinned to a full commit hash with a
# version comment, so a new release arrives as a pull request that changes both, and each update is
# reviewed instead of arriving silently through a moved tag. All updates of a week come as one pull
# request into develop, since main receives only releases and data updates (D40); check.yml tests it
# there, and scripts/lib/workflows.test.ts accepts it without edits because it checks the action's
# name and that the ref is a hash, not the version (docs/plans/EXECPLAN_SUPPORT_CARD_SCORE_TABLE.md,
# D43, D47). Merging stays a person's decision.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
