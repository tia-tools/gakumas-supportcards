name = "gakumas-supportcards"
main = "worker.ts"
compatibility_date = "2026-09-01"

# Custom domain: Cloudflare creates and manages the DNS record when this deploys (the tia.run
# zone is in the same account). One single-level subdomain per tia-tools app; a second level
# (x.gakumas-supportcards.tia.run) is not covered by the zone's free Universal SSL certificate.
routes = [
  { pattern = "gakumas-supportcards.tia.run", custom_domain = true }
]

# The built page (`bun run build` at the repository root writes dist/). Only /img/* and
# /feedback run the Worker first; everything else is served straight from the assets.
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/img/*", "/feedback"]

# The owned image library (docs/adr/0003). Keys are the game's filenames under a rendition prefix
# (w192/ card art, w48/ P-item icons, w112/ skill card icons, sheet112/ their sprite sheets and
# index for gkms-memomemo), uploaded by scripts/images/; img.ts says which keys are served.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tia-assets"

# Per-day feedback counts (feedback.ts): keys fb/<UTC date>/<salted IP hash>, expiring after two
# days. Created once with `bunx wrangler kv namespace create gakumas-supportcards-feedback`;
# the id is not a secret. Secrets FEEDBACK_TOKEN and HASH_SALT: README.md § Feedback.
[[kv_namespaces]]
binding = "FEEDBACK_LIMITS"
id = "9837b184f0a343b78db446d26690aa3a"
