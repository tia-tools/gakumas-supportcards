name = "gakumas-supportcards"
main = "worker.ts"
compatibility_date = "2026-09-01"

# Custom domain: Cloudflare creates and manages the DNS record when this deploys (the tia.run
# zone is in the same account). One single-level subdomain per tia-tools app; a second level
# (x.gakumas-supportcards.tia.run) is not covered by the zone's free Universal SSL certificate.
routes = [
  { pattern = "gakumas-supportcards.tia.run", custom_domain = true }
]

# The built page (`bun run build` at the repository root writes dist/). Only /img/* runs the
# Worker first; everything else is served straight from the assets.
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/img/*"]

# The owned image library (docs/adr/0003). Keys are the game's filenames,
# img_general_{assetId}_full.webp, uploaded by scripts/images/upload.py.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tia-assets"
